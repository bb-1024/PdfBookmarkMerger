<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>

  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1f27">PdfBookmarkMerger &#8211; Project / Layer Dependencies</text>

  <!-- Frontend: WPF -->
  <rect x="50" y="60" width="380" height="140" rx="8" fill="#eef2ff" stroke="#3b4a7a" stroke-width="1.5"/>
  <text x="240" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f27">PdfBookmarkMerger.Wpf</text>
  <text x="240" y="99" text-anchor="middle" font-size="11" fill="#4b5568">net10.0-windows &#183; WPF-UI (FluentWindow)</text>
  <text x="66" y="120" font-size="11" fill="#2b2f3a">MainWindow.xaml(.cs)</text>
  <text x="66" y="137" font-size="11" fill="#2b2f3a">Converters/*  (12 IValueConverter)</text>
  <text x="66" y="154" font-size="11" fill="#2b2f3a">Views/*DialogWindow(.xaml/.cs)</text>
  <text x="66" y="171" font-size="11" fill="#2b2f3a">Controls/*Adorner (drag/drop UI)</text>
  <text x="66" y="188" font-size="11" font-weight="700" fill="#3b4a7a">WpfDialogService : IDialogService</text>

  <!-- Frontend: Avalonia -->
  <rect x="490" y="60" width="380" height="140" rx="8" fill="#eefbf3" stroke="#2f7a52" stroke-width="1.5"/>
  <text x="680" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f27">PdfBookmarkMerger.Avalonia</text>
  <text x="680" y="99" text-anchor="middle" font-size="11" fill="#4b5568">net10.0 &#183; Avalonia UI (Fluent theme)</text>
  <text x="506" y="120" font-size="11" fill="#2b2f3a">MainWindow.axaml(.cs)</text>
  <text x="506" y="137" font-size="11" fill="#2b2f3a">Converters/*  (12 IValueConverter)</text>
  <text x="506" y="154" font-size="11" fill="#2b2f3a">Views/*DialogWindow(.axaml/.cs)</text>
  <text x="506" y="171" font-size="11" fill="#2b2f3a">app.manifest, appsettings.json</text>
  <text x="506" y="188" font-size="11" font-weight="700" fill="#2f7a52">AvaloniaDialogService : IDialogService</text>

  <!-- App layer -->
  <rect x="140" y="255" width="640" height="150" rx="8" fill="#fff7ec" stroke="#a66a1c" stroke-width="1.5"/>
  <text x="460" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f27">PdfBookmarkMerger.App</text>
  <text x="460" y="294" text-anchor="middle" font-size="11" fill="#4b5568">net10.0 &#183; shared ViewModel / Service layer (UI-framework agnostic)</text>
  <text x="156" y="315" font-size="11" fill="#2b2f3a">ViewModels/  MainWindowViewModel, FileListViewModel, BookmarkTreeViewModel,</text>
  <text x="176" y="331" font-size="11" fill="#2b2f3a">BookmarkNodeViewModel, PdfFileEntryViewModel, *DialogViewModel</text>
  <text x="156" y="348" font-size="11" fill="#2b2f3a">Services/    IDialogService (interface only), IUserSettingsService / UserSettingsService</text>
  <text x="156" y="365" font-size="11" fill="#2b2f3a">Undo/UndoHistory&lt;T&gt;, AppLanguageBootstrapper, Resources/Strings (ja/en)</text>
  <text x="156" y="382" font-size="11" fill="#2b2f3a">PdfBookmarkMergerHostFactory &#8212; Generic Host: Configuration + Options + Serilog + DI</text>

  <!-- Core layer -->
  <rect x="230" y="470" width="460" height="130" rx="8" fill="#fdeef0" stroke="#a6294a" stroke-width="1.5"/>
  <text x="460" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f27">PdfBookmarkMerger.Core</text>
  <text x="460" y="509" text-anchor="middle" font-size="11" fill="#4b5568">net10.0 &#183; UI-independent domain layer (depends on PDFsharp)</text>
  <text x="246" y="530" font-size="11" fill="#2b2f3a">Models/   BookmarkNode, PdfFileEntry, PdfFileMetadata, PdfMergeRequest, ...</text>
  <text x="246" y="547" font-size="11" fill="#2b2f3a">Services/ PdfFileCollectorService, PdfMetadataService, MissingBookmarkFallback,</text>
  <text x="266" y="563" font-size="11" fill="#2b2f3a">BookmarkOffsetCalculator, PdfMergeService, BookmarkSettingsExportService</text>
  <text x="246" y="580" font-size="11" fill="#2b2f3a">BookmarkDestinationTypeMapper (internal, Core.Models &#8596; PdfSharp enum)</text>

  <!-- Dependency arrows (solid = "depends on") -->
  <line x1="240" y1="200" x2="360" y2="255" stroke="#3b4257" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="680" y1="200" x2="560" y2="255" stroke="#3b4257" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="460" y1="405" x2="460" y2="470" stroke="#3b4257" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Dependency-inversion arrows (dashed = "implements") -->
  <path d="M 330 255 C 300 235, 280 220, 280 205" fill="none" stroke="#8b95a6" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <path d="M 590 255 C 620 235, 640 220, 640 205" fill="none" stroke="#8b95a6" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="240" y="228" font-size="10" fill="#6b7386">implements</text>
  <text x="645" y="228" font-size="10" fill="#6b7386">implements</text>
  <text x="460" y="245" text-anchor="middle" font-size="10" fill="#6b7386">IDialogService</text>

  <!-- Test projects legend -->
  <rect x="50" y="470" width="150" height="130" rx="8" fill="#f5f6fa" stroke="#8b95a6" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="125" y="490" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b2f3a">Test Projects</text>
  <text x="62" y="512" font-size="10.5" fill="#2b2f3a">Core.Tests</text>
  <text x="62" y="527" font-size="10" fill="#6b7386">&#8594; Core services</text>
  <text x="62" y="546" font-size="10.5" fill="#2b2f3a">App.Tests</text>
  <text x="62" y="561" font-size="10" fill="#6b7386">&#8594; ViewModels + fakes</text>
  <text x="62" y="580" font-size="10.5" fill="#2b2f3a">UiConverters.Tests</text>
  <text x="62" y="595" font-size="10" fill="#6b7386">&#8594; Wpf + Avalonia Converters</text>
</svg>
