<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Consolas, 'Cascadia Mono', 'SF Mono', monospace">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4257"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="640" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f27">Large-tree edit &#8594; chunked recompute &#8594; busy-overlay flow (since v1.2.1)</text>

  <!-- Lifelines -->
  <g font-size="11.5" font-weight="700" fill="#1b1f27">
    <text x="90"  y="58" text-anchor="middle">User</text>
    <text x="255" y="58" text-anchor="middle">BookmarkTreeViewModel</text>
    <text x="500" y="58" text-anchor="middle">MainWindowViewModel</text>
    <text x="720" y="58" text-anchor="middle">MainWindow (UI)</text>
  </g>
  <line x1="90"  y1="68" x2="90"  y2="610" stroke="#c3c9d6" stroke-width="1.4"/>
  <line x1="255" y1="68" x2="255" y2="610" stroke="#c3c9d6" stroke-width="1.4"/>
  <line x1="500" y1="68" x2="500" y2="610" stroke="#c3c9d6" stroke-width="1.4"/>
  <line x1="720" y1="68" x2="720" y2="610" stroke="#c3c9d6" stroke-width="1.4"/>

  <!-- messages -->
  <g font-size="10.7" fill="#2b2f3a">
    <line x1="90" y1="90" x2="245" y2="90" stroke="#3b4257" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="98" y="84">edit / add / remove / Undo (on a tree of N &gt; 200 nodes)</text>

    <line x1="255" y1="112" x2="255" y2="112" stroke="#3b4257"/>
    <text x="265" y="110">TriggerRecompute() &#8212; async void, fire-and-forget</text>
    <text x="265" y="124" fill="#6b7386">(caller keeps its synchronous signature; returns immediately)</text>

    <rect x="245" y="140" width="20" height="330" fill="#fff2d9" stroke="#a66a1c" stroke-width="1"/>
    <text x="275" y="150">RecomputeAllPageNumberDisplaysAsync()</text>

    <text x="275" y="168">total = allNodes.Count  (&gt; RecomputeChunkSize = 200)</text>
    <line x1="255" y1="180" x2="495" y2="180" stroke="#3b4257" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="275" y="176">IsBusy.Value = true; BusyProgress.Value = (0, total)</text>

    <line x1="500" y1="200" x2="715" y2="200" stroke="#3b4257" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="510" y="196">forward: IsBusy.Value = true / BusyProgress.Value = ...</text>
    <text x="510" y="216" fill="#6b7386">(subscribed once in the MainWindowViewModel ctor;</text>
    <text x="510" y="230" fill="#6b7386">StatusMessage is stashed and swapped for &#8220;updating bookmarks&#8230;&#8221;)</text>

    <line x1="720" y1="248" x2="720" y2="248" stroke="#3b4257"/>
    <text x="730" y="246">busy overlay shown (Grid.IsEnabled = false)</text>
    <text x="730" y="260" fill="#6b7386">blocks all further mouse/keyboard input</text>
    <text x="730" y="278" fill="#6b7386">detail text (n / total) appears after 5s via DispatcherTimer</text>

    <text x="275" y="304" font-weight="700">loop i = 0..total-1:</text>
    <text x="291" y="320">write PreOffsetPageNumber / DisplayMergedPageNumber / IsPageNumberEdited</text>
    <text x="291" y="336">back onto each BookmarkNodeViewModel (drives UI bindings)</text>

    <rect x="291" y="350" width="330" height="34" rx="5" fill="#eef2ff" stroke="#3b4a7a" stroke-width="1"/>
    <text x="305" y="371">every 200 nodes: BusyProgress.Value = (i+1, total);</text>
    <text x="305" y="384" fill="#6b7386" font-size="9.6">then &#8212;&#8203;</text>
    <text x="450" y="371" font-weight="700">await Task.Yield();</text>

    <line x1="255" y1="400" x2="90" y2="400" stroke="#8b95a6" stroke-width="1.1" stroke-dasharray="4,3"/>
    <text x="100" y="396" fill="#6b7386">control returns to the UI thread &#8212; repaint / input dispatch happen here</text>

    <text x="275" y="424" fill="#6b7386">(trees at or below 200 nodes: this whole loop runs with zero</text>
    <text x="275" y="438" fill="#6b7386">awaits, so it still completes fully synchronously, unchanged from &lt; v1.2.1)</text>

    <text x="275" y="460">HasPageNumberEdits.Value / HasPageNumberInconsistency.Value updated</text>

    <line x1="255" y1="480" x2="495" y2="480" stroke="#3b4257" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="275" y="476">finally: IsBusy.Value = false; BusyProgress.Value = null</text>

    <line x1="500" y1="500" x2="715" y2="500" stroke="#3b4257" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="510" y="496">forward: IsBusy.Value = false (StatusMessage restored)</text>

    <text x="730" y="520" fill="#6b7386">overlay hidden, input unblocked</text>
  </g>

  <rect x="60" y="560" width="800" height="60" rx="6" fill="#f5f6fa" stroke="#c3c9d6" stroke-width="1"/>
  <text x="76" y="580" font-size="10.7" fill="#2b2f3a">Defense in depth (v1.2.1 code review): the overlay above blocks input while busy, but</text>
  <text x="76" y="596" font-size="10.7" fill="#2b2f3a">UndoCommand's own CanExecute is also gated on CombineLatest(CanUndo, !IsBusy) &#8212;</text>
  <text x="76" y="612" font-size="10.7" fill="#2b2f3a">so a future input path that bypasses the overlay (e.g. a keyboard shortcut) stays safe too.</text>
</svg>
